name: zed-cli GitHub REST blackhole recovery

on:
  pull_request:
    paths:
      - '.github/workflows/zed-cli-github-rest-blackhole.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ZED_CLI_SHA: f286e574c20ab838b49b3039b1662eff4d5fed85
  DEAD_REGISTRY: https://zed-control-plane-intentionally-unavailable.invalid
  ZED_PKG_SOURCE_FALLBACK: 'true'
  ZED_PKG_R2_PUBLIC_BASE: http://127.0.0.1:1

jobs:
  rest-blackhole:
    name: github.com remains sufficient when api.github.com is unreachable
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact zed-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: product/zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'

      - name: Build exact candidate before network fault injection
        working-directory: product/zed-cli
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_SHA"
          cargo build --locked --release --bin zed
          cargo test --locked source_fallback::tests::smart_http_refs_recover_default_branch_and_peeled_tags -- --nocapture
          cargo test --locked source_fallback::tests::github_rest_quota_and_server_failures_are_degradable -- --nocapture

      - name: Blackhole only GitHub REST API
        run: |
          set -Eeuo pipefail
          getent hosts github.com
          git ls-remote https://github.com/zed-pkg-test/github-api-fallback-canary.git HEAD
          echo '127.0.0.1 api.github.com' | sudo tee -a /etc/hosts
          if curl --connect-timeout 2 --max-time 4 --fail --silent https://api.github.com/ >/dev/null 2>&1; then
            echo 'api.github.com unexpectedly remained reachable' >&2
            exit 1
          fi
          git ls-remote https://github.com/zed-pkg-test/github-api-fallback-canary.git HEAD

      - name: Create GitHub-only consumer
        run: |
          set -Eeuo pipefail
          mkdir -p consumer
          cat > consumer/.zpkg.toml <<'EOF'
          [package]
          org = "zed-pkg-test"
          name = "github-rest-blackhole-consumer"
          version = "0.0.0"
          description = "Proves ordinary github.com transport is sufficient without GitHub REST"

          [package.repository]
          vcs = "git"
          url = "https://github.com/zed-pkg-test/ghcr-fallback-canary"

          [install]
          dir = "zed_modules"
          adapter = "none"

          [dependencies]
          "zed-pkg-test/go-lib" = "=1.0.0"
          "zed-pkg-test/python-lib" = "=1.0.0"
          "zed-pkg-test/dart-lib" = "=1.0.0"
          "zed-pkg-test/node-lib" = "=1.0.0"
          "zed-pkg-test/gleam-lib" = "=1.0.0"
          EOF

      - name: Resolve five packages with registry, R2, and GitHub REST unavailable
        run: |
          set -Eeuo pipefail
          ZED="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed"
          unset GITHUB_TOKEN GH_TOKEN ZED_PKG_GITHUB_TOKEN || true
          (
            cd consumer
            "$ZED" --registry "$DEAD_REGISTRY" --home "$RUNNER_TEMP/zed-rest-blackhole-home" install \
              --install-mode copy --adapter none --allow-ecosystem-mismatch
          ) 2>&1 | tee "$RUNNER_TEMP/rest-blackhole.log"
          test -s consumer/.zpkg.lock
          test "$(find consumer/zed_modules -name .zpkg.toml -type f | wc -l)" -ge 5
          for name in go-lib python-lib dart-lib node-lib gleam-lib; do
            grep -R -q "name = \"$name\"" consumer/zed_modules
          done
          grep -E -q 'using GitHub(-first)? fallback' "$RUNNER_TEMP/rest-blackhole.log"

      - name: Frozen replay still succeeds with REST blackholed
        run: |
          set -Eeuo pipefail
          ZED="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed"
          unset GITHUB_TOKEN GH_TOKEN ZED_PKG_GITHUB_TOKEN || true
          cp consumer/.zpkg.lock "$RUNNER_TEMP/rest-blackhole.lock"
          rm -rf consumer/zed_modules "$RUNNER_TEMP/zed-rest-blackhole-frozen"
          (
            cd consumer
            "$ZED" --registry "$DEAD_REGISTRY" --home "$RUNNER_TEMP/zed-rest-blackhole-frozen" install --frozen \
              --install-mode copy --adapter none --allow-ecosystem-mismatch
          ) 2>&1 | tee "$RUNNER_TEMP/rest-blackhole-frozen.log"
          cmp "$RUNNER_TEMP/rest-blackhole.lock" consumer/.zpkg.lock
          test "$(find consumer/zed_modules -name .zpkg.toml -type f | wc -l)" -ge 5

      - name: Retain blackhole evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-cli-github-rest-blackhole-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/rest-blackhole.log
            ${{ runner.temp }}/rest-blackhole-frozen.log
            ${{ runner.temp }}/rest-blackhole.lock
            consumer/.zpkg.lock
